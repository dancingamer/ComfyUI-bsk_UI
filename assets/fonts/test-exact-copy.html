<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完全照搬参考网页</title>
    
    <!-- 完全复制参考网页的字体引入 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Sans+SC:wght@200;300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0807;
            --fg: #f2ece5;
            --muted: #908278;
            --accent: #c8956c;
            --accent-glow: rgba(200, 149, 108, 0.35);
            --card: rgba(20, 18, 15, 0.6);
            --border: rgba(200, 149, 108, 0.18);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 完全复制参考网页的 .title 样式 ===== */
        .title {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            line-height: 1.15;
            letter-spacing: -0.025em;
            margin-bottom: 0.6rem;
            color: var(--fg);
        }
        .title .line-2 {
            display: block;
            color: var(--accent);
            font-style: italic;
        }

        .container {
            text-align: center;
        }

        .divider {
            width: 52px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 1.2rem auto;
        }

        .hint {
            color: #666;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 完全复制参考网页的 HTML 结构 -->
        <h1 class="title">
            <span class="line-2">ComfyUI 工作流</span>
        </h1>
        
        <div class="divider"></div>
        
        <p class="hint">
            如果字体正确，应该看到：<br>
            粗竖笔画 + 细横笔画的笔刷质感
        </p>
    </div>
</body>
</html>
