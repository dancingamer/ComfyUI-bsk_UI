# 训练配置 - 由训练工具自动生成
# model_family: anima, preset: lokr_style

pretrained_model_name_or_path = "/workspace/ComfyUI/models/diffusion_models/anima-base-v1.0.safetensors"
qwen3 = "/workspace/ComfyUI/models/text_encoders/qwen_3_06b_base.safetensors"
vae = "/workspace/ComfyUI/models/vae/qwen_image_vae.safetensors"
t5_tokenizer_path = "/workspace/sd-scripts/configs/t5_old"

output_dir = "/sd-scripts/output"
output_name = "anima_npu_bskfkr"

resolution = "1536,1536"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 2048
train_data_dir = "/train_data"
shuffle_caption = true
keep_tokens = 1
caption_extension = ".txt"
caption_tag_dropout_rate = 0.15

network_module = "networks.lokr"
network_dim = 100000
network_alpha = 1
network_args = ["factor=6", "decompose_both=True", "use_residual=True", "conv_dim=16", "conv_alpha=8", "train_llm_adapter=True"]

learning_rate = 1
train_batch_size = 1
max_train_epochs = 80
save_every_n_epochs = 1
save_last_n_epochs = 10
save_state = true
save_state_on_train_end = true
save_precision = "bf16"

optimizer_type = "prodigyplus.ProdigyPlusScheduleFree"
lr_scheduler = "cosine"
mixed_precision = "bf16"
save_model_as = "safetensors"
seed = 42

mem_eff_attn = true
cache_latents = true
cache_latents_to_disk = true
full_bf16 = true


# ===== Anima 专用 =====
timestep_sampling = "sigmoid"
discrete_flow_shift = 3
attn_mode = "flash"

sample_every_n_epochs = 1
sample_sampler = "euler_a"
sample_prompts = "/workspace/custom_nodes/ComfyUI-bsk_UI/training_configs/sample_prompts.txt"
logging_dir = "output/logs"
log_with = "tensorboard"